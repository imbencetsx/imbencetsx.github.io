<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faviconok</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon/favicon.ico">
    
    <style>
        a.pulzalo {
            display: inline-block;
            font-size: 50px;
            animation: pulzalas 1s infinite;
        }

        @keyframes pulzalas {
            0%, 100% { transfom: scale(1) rotate(0deg);}
            50% { transform: scale(1.2) rotate(-4deg)}
        }
    </style>
</head>
<body style="background-color: black; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div>
       <a
        id="doboz"
        class="pulzalo"
            href="https://chess.com/"
            target="_blank"
            style="color: teal; font-weight: bold; font-family: 'Ubuntu'"
        >
        😂 Kattints Ide 
        </a>
    </div>
    <br>
    <div>
        <button onclick="document.getElementById('doboz').style.backgroundColor = ''" style="margin: 50%; background-color: green">Kattints Ide is!</button>
        <button onclick="document.getElementById('doboz').style.backgroundColor = 'red'" style="margin: 50%; background-color: red;">Kattints Ide is!</button>
    </div>
</body>
</html>
